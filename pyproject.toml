[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor"
version = "0.1.0"
description = "Grounded multimodal AI tutor with timestamp citations, learner memory and a RAG evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "pillow>=10.0", "pyyaml>=6.0", "pydantic>=2.6",
                "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
models = ["torch>=2.3", "sentence-transformers>=3.0", "transformers>=4.44", "datasets>=2.20", "peft>=0.11",
          "faster-whisper>=1.0", "pymupdf>=1.24"]

[project.scripts]
tutor = "tutor.cli:main"

[tool.setuptools.packages.find]
include = ["tutor*"]

[tool.setuptools.package-data]
tutor = ["client/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
